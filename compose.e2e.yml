name: aula4-e2e
services:
  database:
    build: ./database
    environment:
      POSTGRES_DB: aula4_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d aula4_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
  server:
    build: ./server
    environment:
      SERVER_PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: aula4_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  front:
    build: ./front
    environment:
      SERVER_PORT: 3000
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/students"]
      interval: 2s
      timeout: 5s
      retries: 30
